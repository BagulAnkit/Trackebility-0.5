<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Trackebility</title>
  <style>
    :root {
      --bg: #0e1117;
      --card-bg: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f0f2f5;
      --text-muted: #8b949e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px 16px 80px 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 550px; display: flex; flex-direction: column; gap: 14px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px; padding: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center; }
    .label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .quote { font-size: 0.85rem; font-style: italic; color: #cfd3dc; margin: 6px 0; }
    .days-num { font-size: 2.2rem; font-weight: 800; text-align: center; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .val { font-size: 1.25rem; font-weight: 700; margin: 6px 0; }
    .btn { background: rgba(255, 255, 255, 0.1); border: 1px solid var(--border); color: #fff; padding: 6px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn:active { transform: scale(0.96); background: rgba(255, 255, 255, 0.2); }
    .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .act-btn { padding: 12px 6px; border-radius: 12px; border: none; font-weight: 600; font-size: 0.75rem; color: #fff; cursor: pointer; }
    .act-btn:active { transform: scale(0.95); }
    .task-item { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 0.85rem; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background: rgba(14, 17, 23, 0.95); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; }
    .nav-item { font-size: 0.65rem; color: var(--text-muted); font-weight: 700; cursor: pointer; }
    .nav-item.active { color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card header">
      <div>
        <div class="label">Target Exam</div>
        <div class="quote">"Consistency beats intensity every single time."</div>
        <div style="font-size:0.75rem; color:var(--text-muted);" id="timer">00h 00m 00s remaining</div>
      </div>
      <div>
        <div class="days-num" id="daysLeft">30</div>
        <div class="label" style="text-align:center;">Days Left</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="label">Study Focus</div>
        <div class="val" id="focusTime">0h 00m / 5h</div>
        <button class="btn" style="width:100%;" onclick="toggleTimer()">Start Session</button>
      </div>
      <div class="card">
        <div class="label">MCQs Today</div>
        <div class="val" id="mcqCount">0</div>
        <div style="display:flex; gap:6px;">
          <button class="btn" style="flex:1;" onclick="addMCQs(10)">+10</button>
          <button class="btn" style="flex:1;" onclick="addMCQs(25)">+25</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div class="label">Today's Tasks</div>
        <button class="btn" onclick="addTask()">+ Add Task</button>
      </div>
      <div id="taskList">
        <div class="task-item" style="color:var(--text-muted);">No tasks yet. Tap "+ Add Task" to create one.</div>
      </div>
    </div>

    <div class="actions">
      <button class="act-btn" style="background:#7c5cbf;" onclick="toggleTimer()">Study</button>
      <button class="act-btn" style="background:#e67e22;" onclick="alert('Revision Mode Started')">Revision</button>
      <button class="act-btn" style="background:#2ecc71;" onclick="addCustomMCQs()">Log MCQ</button>
      <button class="act-btn" style="background:#3498db;" onclick="addTask()">New Task</button>
      <button class="act-btn" style="background:#e74c3c;" onclick="logMistake()">Mistake</button>
      <button class="act-btn" style="background:#9b59b6;" onclick="logGT()">Grand Test</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active">HOME</div>
    <div class="nav-item">FOCUS</div>
    <div class="nav-item">TASKS</div>
    <div class="nav-item">SYLLABUS</div>
    <div class="nav-item">TRACKER</div>
    <div class="nav-item">STATS</div>
  </nav>

  <script>
    let mcq = 0;
    let focusSecs = 0;
    let running = false;
    let timerId = null;
    let tasks = [];

    function addMCQs(n) {
      mcq += n;
      document.getElementById('mcqCount').textContent = mcq;
    }

    function addCustomMCQs() {
      const input = prompt("How many MCQs did you complete?", "10");
      const val = parseInt(input, 10);
      if (!isNaN(val) && val > 0) addMCQs(val);
    }

    function toggleTimer() {
      const btn = event.target;
      running = !running;
      if (running) {
        btn.textContent = "Pause Session";
        timerId = setInterval(() => {
          focusSecs++;
          const h = Math.floor(focusSecs / 3600);
          const m = Math.floor((focusSecs % 3600) / 60);
          document.getElementById('focusTime').textContent = `${h}h ${String(m).padStart(2,'0')}m / 5h`;
        }, 1000);
      } else {
        clearInterval(timerId);
        btn.textContent = "Start Session";
      }
    }

    function addTask() {
      const desc = prompt("Enter task:");
      if (desc && desc.trim()) {
        tasks.push({ text: desc.trim(), done: false });
        renderTasks();
      }
    }

    function renderTasks() {
      const list = document.getElementById('taskList');
      if (!tasks.length) {
        list.innerHTML = '<div class="task-item" style="color:var(--text-muted);">No tasks yet.</div>';
        return;
      }
      list.innerHTML = tasks.map((t, i) => `
        <div class="task-item">
          <input type="checkbox" onchange="toggleDone(${i})" ${t.done ? 'checked' : ''}>
          <span style="${t.done ? 'text-decoration:line-through; opacity:0.5;' : ''}">${t.text}</span>
        </div>
      `).join('');
    }

    function toggleDone(idx) {
      tasks[idx].done = !tasks[idx].done;
      renderTasks();
    }

    function logMistake() {
      const m = prompt("Enter 20th notebook key takeaway / mistake:");
      if (m) alert("Mistake recorded.");
    }

    function logGT() {
      const score = prompt("Enter Grand Test score / percentile:");
      if (score) alert("Test logged: " + score);
    }
  </script>
</body>
</html>
